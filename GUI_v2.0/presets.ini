ch5 (THRESi)=1.2000
ch6 (unused)=1.2000
ch7 (unused)=1.2000
ch8 (unused)=1.2000
ch9 (unused)=1.2000
ch10 (unused)=1.2000
ch11 (unused)=1.2000

