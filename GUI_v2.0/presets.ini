# Named voltage presets for the 12 DAC channels (volts, 0-5), one per test in section 6 of
# the PSEC6 design document. Each [section] is one preset. "Save current" in the GUI adds more.
# Run the GUI from this directory.
#
# PROVISIONAL CHANNEL MAP: the real DAC-channel-to-pin map is not confirmed. Every preset uses
# the same assignment, so fix it here once the board map is known (edit the ch numbers and the
# labels in parentheses; the GUI only reads the "chN" part of each key). Channels can also be
# renamed in the GUI (the name box next to each channel); "Save current" stores those names here.
#   ch0  DIVIBIAS   (spec 50-100 uA, needs tuning)
#   ch1  CPIBIAS    (spec 50-100 uA, needs tuning)
#   ch2  DISCBIAS   (0.5-0.9 V)
#   ch3  READBIAS1  (0.4-1.0 V)
#   ch4  READBIAS2  (1.5-2.3 V)
#   ch5  THRESi     (0.2-1.0 V, the channel under test)
#   ch6-ch11 unused
# DIVIBIAS/CPIBIAS are left at 0 V in every preset until the series-resistor value or measured
# current is known; raise ch0/ch1 until the bias current reads 50-100 uA.
# The fixed rails (1.2 V: AVDD, DVDD, VCOVDD; 2.5 V: AVDD25, DVDD25) come from the board's
# regulators, not the DACs, so they are not set here.

# Safe state: every channel at 0 V.
[All 0 V]
ch0 (DIVIBIAS)=0.0000
ch1 (CPIBIAS)=0.0000
ch2 (DISCBIAS)=0.0000
ch3 (READBIAS1)=0.0000
ch4 (READBIAS2)=0.0000
ch5 (THRESi)=0.0000
ch6 (unused)=0.0000
ch7 (unused)=0.0000
ch8 (unused)=0.0000
ch9 (unused)=0.0000
ch10 (unused)=0.0000
ch11 (unused)=0.0000

